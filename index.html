overy의 서버 Job 취소는 모든 Job에 영향을 줄 수 있습니다. 현장 운행 상태와 원문에서 Cancel All 적용 범위를 확인한 뒤 수행합니다.","지정 초기 위치에서 원문의 재부팅 방법 한 가지만 수행합니다. 권장 방법은 Steam Deck 컨트롤러 앱 종료 → Parkie → Robot Release ON입니다. 물리 전원 방식은 전면 전원 Off → 1분 이상 대기 → On → 2 Robot Control입니다.","Wviz에서 Localization을, FMS에서 사용할 두 로봇의 위치를 확인합니다."],"escalate":"현장 배치·호기 조합이 원문과 다르면 기재된 면 번호를 임의 적용하지 말고 담당자에게 확인합니다.","tags":["시스템 재시작","재부팅","초기위치","Cancel All","Activate","초기화","원복"],"ref":"SW 0 · 로봇 및 시스템 재시작 방법","urgent":false,"relatedTitles":[],"matrix":{"head":["원문 호기 조합","Job 시작 전 19호기 위치"],"rows":[["17호기 + 19호기","2번면"],["18호기 + 19호기","1번면"]]}},{"src":1,"cat":3,"title":"Job을 요청했는데 로봇이 움직이지 않을 때","symptom":"입차·출차 Job을 요청했지만 로봇이 출발하지 않습니다.","steps":["로봇이 Sim On인지 확인하고 스팀덱에서 Sim Off → Sim On 후 동작을 확인합니다.","RVS 관리자 앱 운행 탭의 RMS API 호출 결과를 확인합니다. 실패한 경우 해당 Job을 주차 취소하고 차량 수동 입력 후 Job을 다시 요청합니다.","FMS의 Job&Missions → Active Jobs에서 Job 생성 여부를 확인합니다.","위 확인 후에도 움직이지 않으면 SW 0의 로봇 및 시스템 재시작 절차를 따릅니다."],"escalate":"재시작 후에도 같으면 유지보수 담당 부서에 연락합니다.","tags":["작업 요청","잡","로봇 안움직임","미동작","출발 안함","API 호출 실패","RMS","Active Jobs","로봇이 안 움직여요","안 움직임","잡 요청했는데 안감","출발 안 해요","입차 요청했는데 로봇이 안와요"],"ref":"SW 1 · Job 요청 후 로봇 미동작","urgent":false,"relatedTitles":["로봇·시스템을 초기 위치에서 재시작할 때"]},{"src":1,"cat":1,"title":"차량 하부 진입 중 바퀴 인식에 실패할 때","symptom":"두 로봇 중 한 대가 차량 바퀴를 인식하지 못합니다.","steps":["두 로봇 모두 Sim Off합니다.","실패한 로봇을 수동으로 차량 바퀴 부근까지 이동한 뒤 그 로봇만 Sim On합니다. 재발하면 이 단계를 다시 수행합니다.","해당 로봇이 정상 동작할 때 나머지 로봇을 Sim On합니다."],"escalate":"바퀴 부근에서도 정상 동작하지 않으면 초기 위치로 옮긴 뒤 원문 SW 2의 원복 분기를 따릅니다. 입차는 드랍존, 출차는 원래 주차면에 차량을 다시 입력한 후 Job을 재요청합니다.","tags":["타이어 인식","바퀴 인식 실패","하부 진입","휠","차 밑"],"ref":"SW 2 · 바퀴 인식 실패","urgent":false,"relatedTitles":["로봇·시스템을 초기 위치에서 재시작할 때","Job을 요청했는데 로봇이 움직이지 않을 때"]},{"src":1,"cat":1,"title":"장애물이 없는데 로봇이 멈출 때","symptom":"로봇이 장애물을 감지해 멈췄지만 주변에 장애물이 보이지 않습니다.","steps":["스팀덱 Sim Off로 오감지 여부를 확인합니다. 다른 로봇을 포함해 반경 2m 안에 실제 장애물이 없는지 현장에서 확인합니다.","실제로 장애물이 없음을 확인한 경우에만 원문 SW 3의 Steam Deck 오감지 처리 절차를 사용합니다.","로봇이 정상 주행하는지 확인합니다."],"escalat const groups=[['비상정지','비상 정지','긴급정지','estop','emergencystop','이머전시'],['통신','네트워크','network'],['와이파이','wifi','무선랜'],['배터리','밧데리','battery'],['엘리베이터','승강기','엘리베이타'],['키오스크','kiosk'],['소음','이상음','소리'],['정전','전원차단','전력차단'],['화재','불이남','불이났'],['정지','멈춤','멈췄','멈춘','멈춰'],['충전스테이션','충전소','충전기'],['입고','입차'],['출고','출차'],['페어링','pairing','패어링']].map(g=>g.map(norm));function variants(t){return [...new Set([t,...groups.filter(g=>g.includes(t)).flat()])]};const texts=cards.map(c=>[norm(c.title),norm(arr(c.tags).join(' ')),norm(c.symptom),norm(namecat(c)),norm(arr(c.steps).join(' ')+' '+(c.escalate||''))]);function hits(q){let tokens=String(q).normalize('NFKC').trim().toLowerCase().split(/[^\p{L}\p{N}]+/u).map(norm).filter(Boolean),whole=norm(q);if(!whole)return[];let vs=tokens.map(variants);return texts.map((f,i)=>{let direct=f.reduce((s,v,k)=>s+(v.includes(whole)?[90,58,44,18,9][k]:0),0);let match=vs.map(g=>f.reduce((s,v,k)=>s+(g.some(x=>v.includes(x))?[24,17,12,7,3][k]:0),0));return {i,s:direct+(match.length&&match.every(Boolean)?match.reduce((a,b)=>a+b,0):0)}}).filter(x=>x.s>0).sort((a,b)=>b.s-a.s||a.i-b.i).map(x=>x.i)}
const crumbs=(label,mid='')=>`<div class="bread"><a href="#home">대응 홈</a> › ${mid}${esc(label)}</div>`;const searchform=q=>`<form class="find" role="search" id="find">${I('search')}<input id="query" type="search" aria-label="증상·장비명·오류 키워드 검색" autocomplete="off" maxlength="160" placeholder="증상, 장비명, 오류 키워드를 입력하세요" value="${esc(q)}"><button type="submit">검색</button></form>`;const examples=()=>{let a=['장애물 오감지','충전기 빨간불','바퀴 인식','이상 소음'].filter(x=>hits(x).length).slice(0,4);if(a.length<2)a=[...new Set(cards.flatMap(c=>arr(c.tags)).filter(x=>x.length<=12))].slice(0,4);return a.length?`<div class="examples"><span>검색 예시</span>${a.map(x=>`<a href="${qlink(x)}">${esc(x)}</a>`).join('')}</div>`:''};const external=(s,l='원문 열기')=>safe(s?.url)?`<a class="outline" href="${safe(s.url)}" target="_blank" rel="noopener noreferrer">${esc(l)} ${I('external')}</a>`:'<span class="mut">원문 링크 미등록</span>';const sec=(k,t,r='')=>`<div class="sectop"><div><span class="kicker">${k}</span><h2>${esc(t)}</h2></div>${r}</div>`;const row=(i,j,showFirst=false)=>{let c=cards[i];return `<a class="row" href="#card/${i}"><span class="num">${pad(j+1)}</span><div class="text"><div class="labs"><span class="pill">${esc(namecat(c))}</span>${urgent(c)?'<span class="pill hot">긴급</span>':''}</div><b>${esc(c.title)}</b><span class="summary">${esc(c.symptom||'상세 절차 확인')}</span>${showFirst&&c.steps?.[0]?`<span class="resultfirst"><strong>첫 조치</strong> ${esc(c.steps[0])}</span>`:''}</div><span class="arrow" aria-hidden="true">›</span></a>`};const rows=(ix,withFirst=false)=>ix.map((v,j)=>row(v,j,withFirst)).join('');const srcSO=sources.find(x=>/연락망/.test(x.title))||sources[0];function home(){return `<section class="hero">${plan}<span class="kicker">FIELD RESPONSE MANUAL</span><h1>파키 현장 대응 매뉴얼</h1><p>지금 보이는 증상으로 찾아, 현장에서 필요한 조치를 확인하세요.</p>${searchform('')}${examples()}</section><section class="sec">${sec('01 / INCIDENT INDEX','장애 카테고리',`<div class="meta"><span>수록 항목 <b>${cards.length}건</b></span><span>웹 자료 업데이트 <b>${esc(D.date||'미표기')}</b></span></div>`)}<div class="grid">${cats.map((c,i)=>`<a class="cat" href="#cat/${i}"><span class="iconbox tone${i%6}">${I(catIcon(c.name,i))}</span><div class="catbody"><span class="unit">${pad(i+1)} / ${cards.filter(x=>Number(x.cat)===i).length}건</span><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p></div><span class="arrow" aria-hidden="true">›</span></a>`).join('')}</div></section><section class="sec">${sec('02 / FIELD DESK','현장 참고 자료')}<div class="strips"><a href="#guide" class="strip">${I('route')}<div><b>대응 흐름·연락망</b><span class="sub">보고 흐름과 문제별 담당팀 확인</span></div><span class="arrow">›</span></a><a href="#sources" class="strip">${I('file')}<div><b>원문 자료실</b><span class="sub">매뉴얼 원본과 참조 위치 확인</span></div><span class="arrow">›</span></a></div></section>`}
function listing(title,desc,ix,k='INCIDENT INDEX'){return crumbs(title)+`<div class="headpanel"><span class="kicker">${k}</span><h1>${esc(title)}</h1><p class="mut">${esc(desc)}</p></div><section class="sec">${sec('CASE LIST','상황별 항목',`<span class="count">총 <b>${ix.length}</b>건</span>`)}${rows(ix)||'<div class="empty">등록된 항목이 없습니다.</div>'}</section>`}function fieldVisual(c){let m=c.matrix;let v=m?'<section class="panel"><span class="kicker">DECISION TABLE</span><h2>조건별 판단표</h2><div class="tbl"><table><thead><tr>'+m.head.map(h=>'<th scope="col">'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+m.rows.map(row=>'<tr><th scope="row">'+esc(row[0])+'</th><td>'+esc(row[1])+'</td></tr>').join('')+'</tbody></table></div></section>':'';let fig=(D.figures||[])[c.fig];if(fig)v+='<figure class="panel eqfig"><span class="kicker">EQUIPMENT GUIDE</span><h2>'+esc(fig.title)+'</h2><img src="'+fig.img+'" alt="'+esc(fig.title)+'"><figcaption>'+esc(fig.ref)+'</figcaption></figure>';return v} function detail(i){let c=cards[i],s=sources[c.src],st=arr(c.steps),tg=arr(c.tags);return crumbs('상세 지침',`<a href="#cat/${+c.cat}">${esc(namecat(c))}</a> › `)+`<div class="headpanel"><span class="kicker">FIELD GUIDE / ${pad(i+1)}</span><div class="labs" style="margin-bottom:8px"><span class="pill">${esc(namecat(c))}</span> ${urgent(c)?'<span class="pill hot">긴급</span>':''}</div><h1>${esc(c.title)}</h1></div><div class="detailgrid"><div><section class="panel"><h2>현상과 첫 조치</h2><p class="pre">${esc(c.symptom||'별도 현상 설명 없음')}</p>${st.length?`<div class="first"><span class="label">첫 조치</span><div class="pre">${esc(st[0])}</div></div>`:''}</section>${fieldVisual(c)}<section class="panel"><span class="kicker">RESPONSE STEPS</span><h2>대응 절차</h2>${st.length?`<ol class="steps">${st.map(t=>`<li class="pre">${esc(t)}</li>`).join('')}</ol>`:'<p>별도 단계가 기재되지 않았습니다. 원문을 확인하세요.</p>'}</section></div><aside><section class="panel"><span class="kicker">ESCALATION</span><h3>보고·이관</h3><p class="pre">${esc(c.escalate||'개별 이관 기준 미기재. 담당팀과 원문 기준을 확인하세요.')}</p><a href="#guide" class="outline">담당팀 확인 ›</a></section><section class="panel"><span class="kicker">REFERENCE</span><h3>근거 자료</h3><p>${esc(s?.title||'미지정')}</p>${c.ref?`<div class="mut pre">${esc(c.ref)}</div>`:''}${external(s)}${tg.length?`<div class="chips">${tg.map(t=>`<a class="tag" href="${qlink(t)}">#${esc(t)}</a>`).join('')}</div>`:''}</section>${related(c)}</aside></div>`}function related(c){const ix=arr(c.relatedTitles).map(t=>cards.findIndex(v=>v!==c&&v.title===t)).filter(n=>n>=0);return ix.length?'<section class="panel"><span class="kicker">RELATED CASES</span><h3>함께 볼 대응 항목</h3>'+[...new Set(ix)].map(i=>'<a class="rel" href="#card/'+i+'">'+esc(cards[i].title)+' <span>›</span></a>').join('')+'</section>':''} function chart(){return /^data:image\/png;base64,[A-Za-z0-9+/=\s]+$/i.test(D.chart||'')?'<figure class="chartbox"><div class="charthead"><h3>장애 발생 시 지침 흐름도</h3><button class="outline" type="button" id="zoom" aria-pressed="false" aria-controls="diagram">원본 확대</button></div><div id="diagram" class="chartclip" tabindex="0" role="region" aria-label="장애 발생 시 지침 흐름도. 확대 후 스크롤로 이동"><img src="'+D.chart+'" alt="비상 대응 프로세스 원문에 수록된 장애 발생 시 지침 흐름도"></div><figcaption>출처: '+esc(srcSO?.title||'비상 대응 원문')+' · 확대 후 좌우·상하로 이동하여 확인하세요.</figcaption></figure>':''} function guide(){return crumbs('대응 흐름·연락망')+`<div class="headpanel"><span class="kicker">FIELD COORDINATION</span><h1>대응 흐름·연락망</h1><p class="mut">현장 대응 흐름을 확인하고, 문제 현상에 맞는 담당팀을 찾으세요.</p></div><section class="sec">${sec('01 / PROCESS','대응 흐름')}${flow.length?`<ol class="flow">${flow.map((v,i)=>`<li><span class="num">${pad(i+1)}</span><span class="pre">${esc(v)}</span></li>`).join('')}</ol>`:'<p>인계·보고 흐름은 비상 대응 원문을 확인하세요.</p>'}${chart()}</section><section class="sec">${sec('02 / CONTACT MATRIX','문제별 담당팀')}<div class="tbl"><table><thead><tr><th scope="col">담당팀</th><th scope="col">문제 현상 · 담당 범위</th></tr></thead><tbody>${teams.map(t=>`<tr><th scope="row">${esc(t.name)}</th><td class="pre">${esc(t.scope)}</td></tr>`).join('')||'<tr><td colspan="2">원문 연락망 참조</td></tr>'}</tbody></table></div><p class="intro">담당자와 전화번호는 권한이 있는 최신 원문 연락망에서 확인하세요.</p>${external(srcSO,'비상 연락망 원문')}</section>`}function library(){return crumbs('원문 자료실')+`<div class="headpanel"><span class="kicker">SOURCE LIBRARY</span><h1>원문 자료실</h1><p class="mut">현장 대응 카드 28건은 본문을 확인한 Loop 자료 2종을 기준으로 작성했습니다. 운영 매뉴얼 v1.2는 별도 참조 자료입니다. 원문 열람에는 사내 계정 권한과 네트워크 연결이 필요합니다.</p></div><section class="sec">${sources.map((s,i)=>`<div class="panel source"><div><span class="kicker">SOURCE / ${pad(i+1)}</span><h2>${esc(s.title)}</h2>${s.date?`<p class="mut">${esc(s.date)}</p>`:''}</div>${external(s)}</div>`).join('')}</section>`}function searchresults(q){const ix=hits(q);return sec('SEARCH RESULTS','검색 결과',`<span class="count" role="status">${q?`“${esc(q)}” · `:''}<b>${ix.length}</b>건</span>`)+(ix.length?rows(ix,true):`<div class="empty">${I('search')}<h3>${q?'일치하는 항목이 없습니다':'검색어를 입력하세요'}</h3><div class="mut">${q?'오류명·장비명처럼 짧은 단어로 바꾸거나 카테고리에서 찾아보세요.':'증상이나 장비 이름으로 관련 절차를 찾을 수 있습니다.'}</div><a class="outline" href="#home">카테고리 보기</a></div>`)}function searchpage(q){return crumbs('키워드 검색')+`<div class="searchhead"><span class="kicker">MANUAL SEARCH</span><h1>키워드 검색</h1>${searchform(q)}${examples()}</div><section class="sec" id="results">${searchresults(q)}</section>`}function show(){let [v='home',...bits]=location.hash.slice(1).split('/'),arg='';try{arg=decodeURIComponent(bits.join('/')).slice(0,160)}catch{}let i=/^\d+$/.test(arg)?Number(arg):-1;let h=v==='cat'&&cats[i]?listing(cats[i].name,cats[i].desc,cards.map((c,j)=>Number(c.cat)===i?j:-1).filter(j=>j>=0)):v==='card'&&cards[i]?detail(i):v==='urgent'?listing('긴급 대응','긴급 상황에 해당하는 항목을 선택해 즉시 조치와 보고 기준을 확인하세요.',cards.map((c,j)=>urgent(c)?j:-1).filter(j=>j>=0),'EMERGENCY RESPONSE'):v==='guide'?guide():v==='sources'?library():v==='search'?searchpage(arg):home();main.innerHTML=h;const zoom=document.getElementById('zoom');if(zoom){const d=document.getElementById('diagram');zoom.onclick=()=>{const on=d.classList.toggle('zoom');zoom.setAttribute('aria-pressed',String(on));zoom.textContent=on?'화면에 맞추기':'원본 확대';if(!on){d.scrollTop=0;d.scrollLeft=0}};d.querySelector('img').onclick=()=>zoom.click()}document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===(['guide','sources','urgent'].includes(v)?v:'home'))a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});document.title=(main.querySelector('h1')?.textContent||'현장 대응')+' | PARKIE';const f=document.getElementById('find'),inp=document.getElementById('query');if(f){f.onsubmit=e=>{e.preventDefault();const q=inp.value.trim();const target=qlink(q);if(location.hash===target){if(v==='search')document.getElementById('results').innerHTML=searchresults(q)}else location.hash=target};if(v==='search'){let timer;inp.oninput=()=>{clearTimeout(timer);timer=setTimeout(()=>{if(!inp.isConnected)return;const q=inp.value.trim();try{history.replaceState(null,'',qlink(q))}catch{}document.getElementById('results').innerHTML=searchresults(q)},100)}}}window.scrollTo(0,0)}window.addEventListener('hashchange',()=>{show();main.focus({preventScroll:true})});document.getElementById('footdate').textContent='웹 자료 업데이트 '+(D.date||'미표기');show();
</script></body></html>
